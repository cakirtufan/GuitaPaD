[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guitapad"
version = "0.1.0"
description = "Real-time guitar effects processor for Audient EVO 4"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "sounddevice>=0.5.5",
]

[tool.setuptools.packages.find]
where = ["src"]